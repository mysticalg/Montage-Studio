name: Native builds and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      MONTAGE_SKIP_GPU_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Windows media tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: macOS media tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb zenity libegl1 libopengl0 libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2 libvulkan1
      - name: Python dependencies
        run: python -m pip install -r requirements.txt -r desktop-requirements.txt
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Bundle AI runtime
        run: python scripts/fetch-ai-tools.py
      - name: App tests
        run: python -m unittest discover -p 'test_*.py'
      - name: Extension tests
        working-directory: x-extension
        run: npm ci --ignore-scripts && npm test
      - name: Build desktop
        run: python build-desktop.py
      - name: Windows and macOS packaged render and GUI
        if: runner.os != 'Linux'
        run: python scripts/smoke-frozen.py
      - name: Linux packaged render and GUI
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke-frozen.py
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-dev-shm-usage
      - name: Package native downloads
        run: python scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Montage-Studio-${{ matrix.label }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* --title "Montage Studio $TAG" --notes "Local montage creation for Windows, macOS (Intel and Apple Silicon), and Linux. Includes the optional X browser extension. FFmpeg/FFprobe and platform prerequisites are required; see the repository README. Unsigned community builds. SHA-256 checksums accompany each package."
