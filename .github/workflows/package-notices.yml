name: Refresh package notices
on:
  workflow_dispatch:
    inputs:
      verified_run:
        description: Successful native build run ID
        required: true
permissions:
  contents: read
  actions: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve tested native archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.verified_run }}
          LABEL: ${{ matrix.label }}
        run: gh run download "$env:RUN_ID" -n "Montage-Studio-$env:LABEL" -D incoming
        shell: pwsh
      - name: Complete distribution notices
        run: python scripts/refresh-package-notices.py
      - uses: actions/upload-artifact@v4
        with:
          name: Montage-Studio-${{ matrix.label }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
